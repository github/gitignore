name: Stale

# **What it does**: Mark pull requests stale after 30 inactive days and close them after 14 more.
# **Why we have it**: This repository gets a lot of PRs, and the maintainers team is small.
#                     This helps reduce the open PRs to ones that are most desired by the community.
# **Who does it impact**: Contributors and maintainers of github/gitignore.

on:
  schedule:
    - cron: '20 16 * * *' # Run every day at 16:20 UTC / 8:20 PST

permissions:
  actions: write
  contents: write # only for delete-branch option
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          stale-pr-message: >
            This PR has had no activity for 30 days. It will close in 14 days
            unless there is further activity. Please leave a comment if you
            want to continue working on it.
          close-pr-message: >
            This PR has been closed after 14 days without activity following
            the stale notice. If you want to continue working on it, please
            open a new PR referencing this one.
          days-before-pr-stale: 30
          days-before-pr-close: 14
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-pr-label: 'stale'
          exempt-pr-labels: 'keep'
          remove-pr-stale-when-updated: true
          ascending: true # Sort PRs by last updated date in ascending order
          operations-per-run: 300
